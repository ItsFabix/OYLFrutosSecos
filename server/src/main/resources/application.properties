# Disponible solo desde este PC (también a través de 10.0.2.2 en el emulador).
server.address=127.0.0.1
server.port=8080
spring.application.name=oyl-api

# Datos ficticios persistentes, para desarrollo local únicamente.
spring.datasource.url=jdbc:h2:file:./oyl-data;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Comunicación entre los microservicios (solo loopback en el PC de desarrollo).
oyl.pickup.url=${OYL_PICKUP_URL:http://127.0.0.1:8081}
oyl.notifications.url=${OYL_NOTIFICATIONS_URL:http://127.0.0.1:8082}
oyl.notifications.flush-ms=2000
