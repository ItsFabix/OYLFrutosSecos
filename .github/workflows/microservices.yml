name: Microservicios Spring Boot
on:
  push:
    branches: [control3-tres-microservicios]
  pull_request:
    paths:
      - 'server/**'
      - 'pickup-service/**'
      - 'notification-service/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/microservices.yml'
  workflow_dispatch:
jobs:
  test-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y probar los tres servicios
        run: bash ./gradlew :server:test :pickup-service:test :notification-service:test :server:bootJar :pickup-service:bootJar :notification-service:bootJar --no-daemon --console=plain
